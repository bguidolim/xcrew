<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <radialGradient id="glow" cx="0.4" cy="0.34" r="0.8">
      <stop offset="0" stop-color="#18202a"/>
      <stop offset="1" stop-color="#0b0e12"/>
    </radialGradient>
    <clipPath id="tile"><rect width="1024" height="1024" rx="228"/></clipPath>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="34"/></filter>
  </defs>
  <g clip-path="url(#tile)">
    <rect width="1024" height="1024" fill="url(#glow)"/>
    <!-- Where the screw's point meets the tile, so it stands rather than floats. -->
    <ellipse cx="560" cy="840" rx="150" ry="44" fill="#000000" fill-opacity="0.55" filter="url(#soft)"/>
    <image x="-14" y="-6" width="1052" height="1052" xlink:href="screw.png"/>
  </g>
  <!-- The banner's frame, in the X's orange: a hairline edge and a bracket on each corner. -->
  <rect x="7" y="7" width="1010" height="1010" rx="221" fill="none" stroke="#ec501d" stroke-opacity="0.35" stroke-width="3"/>
  <g fill="none" stroke="#ec501d" stroke-width="10" stroke-linecap="round">
    <path d="M9 230 A221 221 0 0 1 230 9"/>
    <path d="M794 9 A221 221 0 0 1 1015 230"/>
    <path d="M1015 794 A221 221 0 0 1 794 1015"/>
    <path d="M230 1015 A221 221 0 0 1 9 794"/>
  </g>
</svg>
