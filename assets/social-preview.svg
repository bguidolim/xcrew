<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" xml:space="preserve" width="1280" height="640" viewBox="0 0 1280 640">
  <defs>
    <radialGradient id="glow" cx="0.25" cy="0.45" r="0.8">
      <stop offset="0" stop-color="#161c25"/>
      <stop offset="1" stop-color="#0b0e12"/>
    </radialGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="18"/>
      <feOffset dy="14"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.55"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1280" height="640" fill="url(#glow)"/>

  <!-- Mark and wordmark. -->
  <image x="56" y="118" width="250" height="250" xlink:href="screw.png"/>
  <text x="74" y="458" font-family="Helvetica Neue" font-weight="bold" font-size="104" letter-spacing="-2" fill="#f3f4f6">Xcrew</text>
  <g font-family="Helvetica Neue" font-weight="500" font-size="21" letter-spacing="4" fill="#a9afb9">
    <text x="78" y="500">XCODE TOOLING</text>
    <text x="78" y="530">FOR CLAUDE CODE</text>
  </g>
  <line x1="78" y1="556" x2="236" y2="556" stroke="#ec501d" stroke-opacity="0.75" stroke-width="2"/>

  <!-- An Xcode-like editor window, drawn rather than captured. -->
  <clipPath id="card"><rect width="1280" height="640"/></clipPath>
  <g clip-path="url(#card)"><g filter="url(#shadow)" transform="translate(70 18)">
    <rect x="500" y="84" width="900" height="460" rx="16" fill="#1f2025" stroke="#3a3d45" stroke-width="1.5"/>
    <!-- title bar -->
    <path d="M500 100 A16 16 0 0 1 516 84 H1400 V128 H500 Z" fill="#26282e"/>
    <line x1="500" y1="128" x2="1400" y2="128" stroke="#34363d" stroke-width="1"/>
    <circle cx="526" cy="106" r="7" fill="#ff5f57"/>
    <circle cx="550" cy="106" r="7" fill="#febc2e"/>
    <circle cx="574" cy="106" r="7" fill="#28c840"/>
    <path d="M610 99 L622 106 L610 113 Z" fill="#c9ccd3"/>
    <rect x="760" y="94" width="208" height="24" rx="12" fill="#1c1d22" stroke="#3a3d45"/>
    <text x="864" y="111" text-anchor="middle" font-family="Helvetica Neue" font-size="13" fill="#d7dae0">MyApp  ›  iPhone 17</text>
    <!-- sidebar -->
    <rect x="501" y="129" width="176" height="414" fill="#232429"/>
    <line x1="677" y1="129" x2="677" y2="543" stroke="#34363d"/>
    <g font-family="Helvetica Neue" font-size="13" fill="#d7dae0">
      <text x="520" y="158">▾  MyApp</text>
      <rect x="536" y="168" width="12" height="14" rx="2.5" fill="none" stroke="#8b949e" stroke-width="1.3"/>
      <text x="556" y="180">Order.swift</text>
      <rect x="532" y="190" width="140" height="22" rx="5" fill="#2f4b78"/>
      <rect x="536" y="194" width="12" height="14" rx="2.5" fill="none" stroke="#c9d5ea" stroke-width="1.3"/>
      <text x="556" y="206" fill="#ffffff">RefundTests.swift</text>
      <rect x="536" y="220" width="12" height="14" rx="2.5" fill="none" stroke="#8b949e" stroke-width="1.3"/>
      <text x="556" y="232">ContentView.swift</text>
      <text x="520" y="268">▸  Packages</text>
    </g>
    <!-- code -->
    <g font-family="Menlo" font-size="15">
      <g fill="#6c7079" text-anchor="end">
        <text x="712" y="166">1</text><text x="712" y="192">2</text><text x="712" y="218">3</text><text x="712" y="244">4</text>
        <text x="712" y="270">5</text><text x="712" y="296">6</text><text x="712" y="322">7</text><text x="712" y="348">8</text>
      </g>
      <text x="728" y="166"><tspan fill="#ff7ab2">import</tspan><tspan fill="#d7dae0"> Testing</tspan></text>
      <text x="728" y="218"><tspan fill="#ff7ab2">@Test</tspan><tspan fill="#ff7ab2"> func</tspan><tspan fill="#67b7a4"> refundsAreNeverNegative</tspan><tspan fill="#d7dae0">() {</tspan></text>
      <text x="728" y="244"><tspan fill="#d7dae0">    </tspan><tspan fill="#ff7ab2">let</tspan><tspan fill="#d7dae0"> order = </tspan><tspan fill="#67b7a4">Order</tspan><tspan fill="#d7dae0">(total: </tspan><tspan fill="#d9c97c">42</tspan><tspan fill="#d7dae0">)</tspan></text>
      <text x="728" y="270"><tspan fill="#d7dae0">    </tspan><tspan fill="#ec501d">#expect</tspan><tspan fill="#d7dae0">(order.</tspan><tspan fill="#67b7a4">refund</tspan><tspan fill="#d7dae0">(</tspan><tspan fill="#d9c97c">50</tspan><tspan fill="#d7dae0">) == </tspan><tspan fill="#d9c97c">0</tspan><tspan fill="#d7dae0">)</tspan></text>
      <text x="728" y="296" fill="#d7dae0">}</text>
    </g>
  </g></g>

  <!-- What Xcrew adds: the live status line, then the result toast. -->
  <g font-family="Menlo" font-size="15" transform="translate(70 18)">
    <rect x="696" y="396" width="500" height="34" rx="8" fill="#14171d" stroke="#3a3d45"/>
    <circle cx="716" cy="413" r="4.5" fill="#ec501d"/>
    <text x="732" y="418" fill="#a9afb9">test_sim · MyApp on iPhone 17 · 0:41</text>
    <rect x="660" y="444" width="560" height="46" rx="10" fill="#0d1117" stroke="#ec501d" stroke-width="2"/>
    <text x="684" y="473"><tspan fill="#3fb950">✓</tspan><tspan fill="#f3f4f6">  test_sim · 1:12 (avg 1:05) · 412 passed</tspan></text>
  </g>
  <!-- The banner's frame: a hairline and a bracket on each corner, in the X's orange. -->
  <rect x="6" y="6" width="1268" height="628" fill="none" stroke="#ec501d" stroke-opacity="0.35" stroke-width="2"/>
  <g fill="none" stroke="#ec501d" stroke-width="5" stroke-linecap="square">
    <path d="M8 52 V8 H52"/>
    <path d="M1228 8 H1272 V52"/>
    <path d="M8 588 V632 H52"/>
    <path d="M1228 632 H1272 V588"/>
  </g>

</svg>
