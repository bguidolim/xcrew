name: Bug report
description: Something in xcrew doesn't work as described
body:
  - type: textarea
    id: what
    attributes:
      label: What happened, and what you expected
    validations:
      required: true
  - type: textarea
    id: doctor
    attributes:
      label: Output of `xcrew doctor`
      description: Run it in the affected project (from Claude Code, or `~/.claude/plugins/…/bin/xcrew doctor`).
      render: text
    validations:
      required: true
  - type: input
    id: versions
    attributes:
      label: Versions
      description: "`sw_vers -productVersion`, `xcodebuild -version`, `claude --version`, `mobilebuildmcp --version`"
    validations:
      required: true
  - type: dropdown
    id: install
    attributes:
      label: Installed through
      options:
        - Claude Code plugin
        - mcs
    validations:
      required: true
